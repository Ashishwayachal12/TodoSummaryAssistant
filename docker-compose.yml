services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo_db
      MYSQL_USER: ${MYSQL_USER:-todoapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ashishwayachal}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ashishwayachal}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-todoapp}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ashishwayachal}
      COHERE_API_KEY: ${COHERE_API_KEY:-R0o9PbymSOBiscSr9L7YktWfVjl9Id2DDcm2LaxJ}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/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}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://16.170.7.63:3000}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://16.170.7.63:8080/api/todos}
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mysql_data:
